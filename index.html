<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cooperativa Mbanza Kongo</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.lang-choice { text-align: center; max-width: 600px; }
.lang-choice .emblem {
  font-family: var(--font-display); font-style: italic; font-weight: 900;
  font-size: 6rem; color: var(--terre); line-height: 1; margin-bottom: 1rem;
}
.lang-choice h1 {
  font-family: var(--font-display); font-size: 2rem; font-weight: 700;
  letter-spacing: -0.02em; margin-bottom: 0.5rem;
}
.lang-choice .sub {
  font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--sauge-foncee); margin-bottom: 3rem;
}
.lang-choice .options { display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; }
.lang-choice .options a {
  display: block; padding: 2rem 3rem; background: var(--creme-doux);
  text-decoration: none; color: var(--noir); border-radius: 4px;
  border: 1px solid rgba(139, 69, 19, 0.15); transition: all 0.3s; min-width: 200px;
}
.lang-choice .options a:hover {
  transform: translateY(-4px); background: var(--terre); color: var(--creme);
  box-shadow: 0 12px 30px rgba(139, 69, 19, 0.15);
}
.lang-choice .options strong {
  display: block; font-family: var(--font-display); font-size: 1.5rem;
  font-weight: 700; margin-bottom: 0.3rem;
}
.lang-choice .options span {
  font-size: 0.85rem; opacity: 0.7; letter-spacing: 0.05em;
}
</style>
</head>
<body>
<div class="lang-choice">
  <div class="emblem">M</div>
  <h1>Cooperativa Agrícola</h1>
  <p class="sub">Mbanza Kongo · Angola</p>
  <div class="options">
    <a href="fr/index.html"><strong>Français</strong><span>Entrer sur le site →</span></a>
    <a href="pt/index.html"><strong>Português</strong><span>Entrar no site →</span></a>
  </div>
</div>
</body>
</html>
